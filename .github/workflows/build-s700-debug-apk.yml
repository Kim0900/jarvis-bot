name: Build S700 Collector Debug APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 's700-collector-android/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        id: build
        working-directory: s700-collector-android/s700_collector_v1
        continue-on-error: true
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace --rerun-tasks 2>&1 | tee /tmp/build.log
          echo "===FIND APK===" | tee -a /tmp/build.log
          find . -name "*.apk" 2>&1 | tee -a /tmp/build.log
          echo "===FIND BUILD DIR===" | tee -a /tmp/build.log
          find . -path "*/build/outputs*" 2>&1 | tee -a /tmp/build.log

      - name: Save build log to repo (always)
        run: |
          mkdir -p build-logs
          cp /tmp/build.log "build-logs/latest-build-log.txt"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-logs/latest-build-log.txt
          git commit -m "CI: save build log [skip ci]" || echo "nothing to commit"
          git push

      - name: Upload Debug APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: s700-collector-debug-apk
          path: s700-collector-android/s700_collector_v1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
