name: Task164 daily_history regression

on:
  pull_request:
    paths:
      - "daily_history_layout_parser.py"
      - "tests/test_canonical_identity_v1.py"
      - "tests/test_canonical_access_v1.py"
      - "migrations/task164_canonical_raw_calls_v1.sql"
      - "daily_history_primary_adapter.py"
      - "canonical_identity_v1.py"
      - "canonical_access_v1.py"
      - "tesseract-ocr-service/app.py"
      - "bot_v5_legacy.py"
      - "tests/test_image_retry_policy.py"
      - "image_retry_policy.py"
      - "daily_history_parser.py"
      - "scripts/daily_history_overlay_poc.py"
      - "tesseract-ocr-service/daily_history_layout_parser.py"
      - "tesseract-ocr-service/daily_history_overlay_poc.py"
      - "tesseract-ocr-service/daily_history_parser.py"
      - "tests/test_daily_history_layout_parser.py"
      - ".github/workflows/task164-regression.yml"
  push:
    branches: [main]
    paths:
      - "daily_history_layout_parser.py"
      - "daily_history_parser.py"
      - "scripts/daily_history_overlay_poc.py"
      - "tesseract-ocr-service/daily_history_layout_parser.py"
      - "tesseract-ocr-service/daily_history_overlay_poc.py"
      - "tesseract-ocr-service/daily_history_parser.py"
      - "tests/test_daily_history_layout_parser.py"
      - ".github/workflows/task164-regression.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Syntax check
        run: |
          python -m py_compile             canonical_access_v1.py             canonical_identity_v1.py             daily_history_primary_adapter.py             image_retry_policy.py             bot_v5_legacy.py             daily_history_layout_parser.py             daily_history_parser.py             scripts/daily_history_overlay_poc.py             tesseract-ocr-service/daily_history_layout_parser.py             tesseract-ocr-service/daily_history_overlay_poc.py             tesseract-ocr-service/daily_history_parser.py
      - name: Task164 deterministic regression
        run: python -m unittest tests.test_daily_history_layout_parser -v
