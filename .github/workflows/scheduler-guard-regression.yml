name: Scheduler guard fail-closed regression

on:
  pull_request:
    paths:
      - "bot_v5_legacy.py"
      - "tests/test_scheduler_guard_fail_closed.py"
      - ".github/workflows/scheduler-guard-regression.yml"
  push:
    branches: [main]
    paths:
      - "bot_v5_legacy.py"
      - "tests/test_scheduler_guard_fail_closed.py"
      - ".github/workflows/scheduler-guard-regression.yml"

permissions:
  contents: read

jobs:
  scheduler-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile bot_v5_legacy.py tests/test_scheduler_guard_fail_closed.py
      - name: Scheduler state regression
        run: python -m unittest tests.test_scheduler_guard_fail_closed -v
