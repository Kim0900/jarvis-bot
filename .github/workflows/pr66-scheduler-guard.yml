name: PR66 scheduler guard regression
on:
  pull_request:
    paths:
      - 'bot_v5_legacy.py'
      - 'tests/test_scheduler_guard_fail_closed.py'
      - 'tests/test_scheduler_guard_before_after.py'
      - 'tests/test_scheduler_guard_db_integration.py'
      - 'tests/test_scheduler_guard_dispatch_wiring.py'
      - '.github/workflows/pr66-scheduler-guard.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch baseline main
        run: git fetch origin main
      - name: Compile target and tests
        run: python -m py_compile bot_v5_legacy.py tests/test_scheduler_guard_fail_closed.py tests/test_scheduler_guard_before_after.py tests/test_scheduler_guard_db_integration.py tests/test_scheduler_guard_dispatch_wiring.py
      - name: Reproduce database failure and validate fail-closed guard
        run: python -m unittest discover -s tests -p 'test_scheduler_guard*.py' -v
